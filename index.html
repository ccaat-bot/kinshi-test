{n:"三日月宗近",w:{0:3,3:3,2:2,5:1},d:"三条家的老太爷。脾气宽和，不催不迫，最擅长让人放松下来。适合喜欢安静环境的人；事务性的琐碎工作他多半记不住，需要旁人补位。",s:"近侍么。嗯，也好。您慢慢来，我陪您坐着。"},

{n:"にっかり青江",w:{5:2,3:2,7:1,2:1},d:"嘴上爱说怪话，脑子却清楚，善于看穿别人的心思。适合喜欢被猜中的人；不喜欢被点破的，相处起来会有些难受。",s:"咦，您挑了我？那往后您的心思，我可要随便猜了。"},
{n:"骨喰藤四郎",w:{3:3,7:1,0:1,1:1},d:"话少，记性差，但对在意的人记得很牢。不必交代太多，他也不会追问。",s:"名字我记不太牢。……可您的事，我记得。"},
{n:"鯰尾藤四郎",w:{4:2,6:2,0:1},d:"活泼好动，精力过剩。适合爱热闹的日子；想清静的时候不要选他。",s:"好啊好啊！那我们从头玩起吧！"},
{n:"一期一振",w:{0:3,1:2,2:2},d:"规矩周到，做事体面，安排有条理。照顾人很细心，管束也偏严。",s:"交给我。您的行程、文书、起居，我都会安排妥当。"},
{n:"薬研藤四郎",w:{5:3,1:1,6:2},d:"像军医一样的一把。作息、饮食、用药他都会盯住。需要有人管住自己的人，选他最有效。",s:"先说好：饭按点吃，药不许停。这不是跟您商量。"},
{n:"五虎退",w:{6:3,0:2,3:1},d:"胆子小，但在要紧事上从不退。会让人产生想护着他的念头，随后又被他反过来护着。",s:"我、我会努力的……您别嫌我慢就好。"},
{n:"秋田藤四郎",w:{6:2,0:2,4:1},d:"手脚勤快，嘴甜，做错了事会立刻道歉。适合想要身边热闹又听话的人。",s:"那我先把茶端来！您歇着，别的都归我。"},
{n:"前田藤四郎",w:{0:2,6:2,1:1},d:"认真守规矩，会把说过的每句话都写进册子。在他面前随口许诺要谨慎。",s:"主命如此。您说过的每一句，我都会记在册子上。"},
{n:"平野藤四郎",w:{1:2,0:2,6:1},d:"稳当，不吵，办事有章法。适合忙起来顾不上身边人的时候。",s:"您忙您的。剩下的我来理，不必回头交代。"},

{n:"大和守安定",w:{1:3,4:2,7:1},d:"认真，嘴上不饶人，说完了照样把事办妥。",s:"该说的我会说。说完了，我再替您办。"},
{n:"歌仙兼定",w:{2:3,0:2,3:1},d:"讲究风雅，插花、研墨、摆茶都在行，也要求坐姿端正。",s:"姿态要正，坐相也要好。从今日起，我盯着您。"},
{n:"和泉守兼定",w:{4:3,2:2,1:1},d:"直来直去，说话不过脑子，心是热的。适合受得住吵的人。",s:"有我在您就别怕。麻烦事全推给我！"},
{n:"陸奥守吉行",w:{4:3,6:1,0:1},d:"土佐出身，嗓门亮，饭量也亮。会拉着人下地、喝酒、说些没正经的话。",s:"今晚先喝一杯！正事明日再说！"},
{n:"鳴狐",w:{3:2,6:2,0:1},d:"身边总跟着一只狐狸。他话少，那只狐狸会替他把话说尽。",s:"（狐狸叫了一声）……它说，往后请多指教。"},
{n:"鶴丸国永",w:{2:3,4:2,5:1},d:"爱吓人，也爱热闹。会被他惊着几回，但日子不会再闷。",s:"哦？我可是会吓人的。您的心脏撑得住么？"},
{n:"へし切長谷部",w:{1:3,0:2,3:1,4:1,7:1},d:"办事严谨，规矩清楚，日程、文书、起居都能打理妥帖。性子偏强势，习惯把事揽在自己手里。不喜欢被旁人插手安排的人，可能会觉得他管得宽。",s:"请交给我。您的作息、文书、饭食与安危，我不会让给任何人。若嫌我管得多，现在改选还来得及。"},
{n:"日本号",w:{4:3,0:2,2:1},d:"能喝能说能打，会把身边人灌醉，再背回去。",s:"先喝一场！喝完了什么都好说！"},
{n:"巴形薙刀",w:{3:3,1:2,0:1},d:"冷静规矩，像一把量尺。能把宅子管得清清楚楚，也会盯得人不敢偷懒。",s:"规矩我立，时间表我排。您照做，日子会很清爽。"},
{n:"千子村正",w:{2:3,4:2,7:1},d:"华丽，话多，主张强。他在旁边，场面会亮起来，也会热闹得过头。",s:"我会让整座宅子都亮起来——您等着瞧。"},
{n:"髭切",w:{2:2,0:2,4:2,1:1},d:"笑呵呵的，记性不太好，该护人的时候护得极狠。",s:"嗯？近侍？好啊好啊。您的名字……我记住了。"},
{n:"膝丸",w:{1:2,4:2,0:1,3:1},d:"认真守礼，处处按规矩来。适合想找个可以放心托付的。",s:"礼数我会做足。事情您尽管托付下来。"},
{n:"物吉貞宗",w:{0:3,4:2,2:1},d:"讨人喜欢，嘴甜，运气也好。他在身边，坏事会少几件。",s:"有我在，运气会好起来的。您别担心。"},
{n:"大般若長光",w:{2:3,3:1,5:2,0:1},d:"爱开玩笑，实则精明。会一边逗人，一边把事办完。",s:"哎哟，中选了。那我可得认真办，不然要被您笑话。"}
];
function fresh(){return {i:0,t:[0,0,0,0,0,0,0,0],freq:[0,0,0,0,0,0,0,0]};}
var st=fresh();
function el(id){return document.getElementById(id);}
(function countFreq(){
QS.forEach(function(q){
q.o.forEach(function(o){
st.freq[o[1]]++;
st.freq[o[2]]++;
});
});
})();
function render(){
var q=QS[st.i];
el("qt").textContent="第 "+(st.i+1)+" 问";
el("qq").textContent=q.q;
el("qn").textContent=st.i+1;
el("barfill").style.width=(st.i/35*100)+"%";
var box=el("opts");
box.innerHTML="";
q.o.forEach(function(o,k){
var b=document.createElement("button");
b.className="opt";
b.style.animationDelay=(k*0.05)+"s";
b.textContent=o[0];
b.setAttribute("data-k",k);
box.appendChild(b);
});
el("qbox").scrollTop=0;
}
function dots(v){
var n=Math.max(1,Math.min(5,v));
var s="";
for(var i=0;i<5;i++){s+=(i<n?"●":"○");}
return s;
}
function pick(o){
st.t[o[1]]+=2;
st.t[o[2]]+=2;
st.i++;
if(st.i>=QS.length){result();return;}
render();
}
function result(){
el("quizScreen").classList.add("hide");
el("resScreen").classList.remove("hide");
var avgFreq=0;
for(var i=0;i<8;i++){avgFreq+=st.freq[i];}
avgFreq=avgFreq/8||1;
var u=[];
var un=0;
for(var i=0;i<8;i++){
var raw=st.t[i];
var normalized=st.freq[i]>0?(raw/st.freq[i]):0;
u[i]=normalized;
un+=normalized*normalized;
}
un=Math.sqrt(un)||1;
var best=null,bs=-1;
CANDS.forEach(function(c){
var dot=0,wn=0;
for(var k in c.w){
dot+=u[k]*c.w[k];
wn+=c.w[k]*c.w[k];
}
var s=dot/(un*(Math.sqrt(wn)||1));
if(s>bs){bs=s;best=c;}
});
el("res").innerHTML=
'<span class="seal">選 抜 結 果</span>'+
'<h2>'+best.n+'</h2>'+
'<div class="dots">'+dots(5)+'</div>'+
'<div class="labels">契合度 · 第一名</div>'+
'<div class="div"></div>'+
'<div class="lb">解 析</div>'+
'<div class="desc">'+best.d+'</div>'+
'<div class="div"></div>'+
'<div class="lb">本 人 一 言</div>'+
'<div class="say">'+best.s+'<span class="nm">——'+best.n+'</span></div>'+
'<div class="fine">结果按本次答题的倾向计算，仅供参考。若与实际相处观感不符，请以您自己的判断为准。</div>'+
'<button id="againBtn">重新作答</button>';
el("res").scrollTop=0;
el("againBtn").addEventListener("click",function(){
st=fresh();
(function(){QS.forEach(function(q){q.o.forEach(function(o){st.freq[o[1]]++;st.freq[o[2]]++;});});})();
el("resScreen").classList.add("hide");
el("quizScreen").classList.remove("hide");
render();
});
}
el("opts").addEventListener("click",function(e){
var b=e.target.closest(".opt");
if(!b)return;
var k=parseInt(b.getAttribute("data-k"),10);
if(isNaN(k))return;
pick(QS[st.i].o[k]);
});
el("startBtn").addEventListener("click",function(){
st=fresh();
(function(){QS.forEach(function(q){q.o.forEach(function(o){st.freq[o[1]]++;st.freq[o[2]]++;});});})();
el("coverScreen").classList.add("hide");
el("quizScreen").classList.remove("hide");
render();
});
(function(){QS.forEach(function(q){q.o.forEach(function(o){st.freq[o[1]]++;st.freq[o[2]]++;});});})();
render();
})();
</script>
</body>
</html>
